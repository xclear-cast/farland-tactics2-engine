name: Actual macOS Finder guide captures

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Apple Silicon build run containing the real app ZIP
        required: true
        default: '40938160129'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  capture-real-finder:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Install encryption library
        run: python -m pip install cryptography
      - name: Download this project's actual Mac app artifact
        uses: actions/download-artifact@v4
        with:
          name: FT2-macos-arm64
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ft2-guide-input
      - name: Capture only actual temporary Finder windows
        env:
          FINDER_GUIDE_CAPTURE_KEY: ${{ secrets.FINDER_GUIDE_CAPTURE_KEY }}
        run: |
          python tools/guide/capture_macos_folders.py \
            --archive "$RUNNER_TEMP/ft2-guide-input/FT2-External-macos-arm64.zip" \
            --output "$RUNNER_TEMP/ft2-guide-output"
      - name: Upload encrypted captures and non-image status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-finder-guide-private-captures
          path: |
            ${{ runner.temp }}/ft2-guide-output/capture_report.json
            ${{ runner.temp }}/ft2-guide-output/finder-captures.aesgcm
          if-no-files-found: warn
          retention-days: 1
